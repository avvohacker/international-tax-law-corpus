# The register of every input this project reads.
#
# Invariant F11: every source has a URL, a SHA-256, a retrieval date and a
# verified, dated rights note, and nothing is silently absent from the register.
# `tests/test_invariants.py::test_f11_*` reads this file; `harness/report.py`
# never copies a number out of it by hand.
#
# The PDFs themselves are NOT redistributed. They are fetched, hashed and
# ignored by git (`.gitignore`), which is why the hash, not the file, is the
# contract. `sha256` is the hash of the exact bytes the extraction was run on.
#
# Every hash below was verified with `shasum -a 256` on 2026-09-27, against the
# same bytes the audit was performed on.
#
# rights.status:  public_domain | open_licence | licence_with_conditions | unknown
# rights.redistribute: whether the PDF may be committed to this repository.
#
# produces: what the pipeline builds FROM this source. It is declared here, next
#   to the hash of the bytes it is built from, because "what is this source for"
#   is a property of the register and not of the code that happens to read it.
#   `tests/test_invariants.py::test_f07_build_is_byte_identical` builds exactly
#   what is declared here and fails when a source declares an artefact it cannot
#   produce; `harness/report.py` prints the same declaration, so a source whose
#   artefact is not built yet is a line in the status report rather than an
#   absence somebody has to notice.
#
#
# `artefact`: where in `corpora/` that thing is, so that "is it there" is a
#   lookup and not a derivation - the register knows the path, and no reader has
#   to reconstruct it from the id.
#
#     akn    corpora/<family>/<edition>/ - the span ledger, the node index, the
#            AKN document, its manifest and the markdown views
#     table  one JSON document: the source is a table, and its corpus artefact
#            is the table's data rather than a marked-up document
#     positions  one JSON document per jurisdiction, under positions/: the
#            source is a country's position, which is prose and table together
#     mapping  one JSON document: the source is the Convention, and its
#            artefact is the index of what each Article does to a treaty
#     none   the register declares that no corpus artefact is built from this
#            source yet, with the reason, and F7 compares the one artefact the
#            pipeline does produce for it: the reading, which is what F2 and F6
#            are answered from.
#     schema a standard the corpus is checked against rather than read from:
#            the artefact is the vendored copy itself (vendor/akn/), pinned in
#            a manifest, and `python -m harness oasis` validates every AKN
#            document against it without reaching for anything but the vendored
#            files. A `none` source produces no artefact; this one produces the
#            schema, and the corpus is the thing being measured against it.

