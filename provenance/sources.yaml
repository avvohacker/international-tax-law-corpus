# One entry for a whole family of documents that share a URL pattern: the
# publisher ships one position per jurisdiction, they are all laid out the same
# way, and 110 entries saying so would be a register nobody reads. The per-file
# hashes live in `manifest`, which is exactly as binding as an inline hash and is
# verified the same way (F11); keeping them out of this file keeps the register
# readable without making any byte uncheckable.
#
# The dir and its manifest are also the completeness contract: a document in
# `dir` that is not in `manifest` is a file nobody hashed, and a line in
# `manifest` whose file is not in `dir` is a hash of nothing.
- id: mli-positions-batch
  produces: positions
  artefact: corpora/mli/positions/
  title: MLI positions - one PDF per jurisdiction
  publisher: OECD
  url_pattern: >-
    https://www.oecd.org/content/dam/oecd/en/topics/policy-sub-issues/beps-mli/beps-mli-position-{slug}.pdf
  dir: sources/mli-positions
  manifest: provenance/mli-positions.sha256
  retrieved: 2026-09-26
  note: >-
    Read in one pass, which writes one position per document that could be read
    (corpora/mli/positions/<slug>.json) and the family's own account of itself
    (corpora/mli/positions/batch-report.json): how many documents the directory
    declares, which were read, which were not and why. A document that cannot be
    read from its bytes is in that report with the reader's reason instead of
    being published as a position about a jurisdiction that notified nothing.
    The four positions this project's audit named - Italy, Germany, Czechia, and
    Czechia's additional notifications - are documents of this family like the
    rest, read here and published under the slugs their own titles give.
  rights:
    status: licence_with_conditions
    redistribute: false
    basis: OECD Terms and Conditions; used with citation.
    attribution: "OECD, MLI positions"
    verified_on: 2026-09-27

# The schema is vendored, not read from: it is committed verbatim under
# `vendor/akn/`, pinned file by file in `provenance/akn-xsd.sha256`, and used by
# `python -m harness oasis`, which is invariant F7's strongest form - the
# document the pipeline writes is checked against the document the standard
# describes, with no network and no second copy of the schema anywhere.
#
# The copy vendored here is the last release of the OASIS TC Open Repository
# whose target namespace is the namespace this corpus writes,
# `http://docs.oasis-open.org/legaldocml/ns/akn/3.0`. The CS02 draft in the same
# repository declares the working namespace `.../akn/3.0/WD17` and would
# validate a different vocabulary, so it is named here and deliberately not
# vendored: a schema that does not name the corpus' own namespace could not
# validate it, and vendoring it would make the disagreement invisible.
- id: akn-xsd
  produces: schema
  artefact: vendor/akn/
  manifest: provenance/akn-xsd.sha256
  title: Akoma Ntoso 3.0 schema
  publisher: OASIS legaldocml TC Open Repository
  url: >-
    https://raw.githubusercontent.com/oasis-open/legaldocml-akomantoso/d79ac76044de7a8d2f8c156dbceb86c8e3b0f7aa/TemporaryRelease20170330Final/akomantoso30.xsd
  files:
    - vendor/akn/akomantoso30.xsd
    - vendor/akn/xml.xsd
  retrieved: 2026-10-13
  rights:
    status: open_licence
    redistribute: true
    basis: >-
      OASIS TC Open Repository; vendored verbatim and validated against, never
      extracted from. Redistribution is the point of a vendored schema: the
      bytes a validation ran against have to be in the commit that claims it.
    attribution: "OASIS legaldocml TC, Akoma Ntoso 3.0"
    verified_on: 2026-10-13
