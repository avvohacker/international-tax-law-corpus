- id: d25-azerbaijan-footer-band-ate-table-rows
  invariant: P2
  status: regression
  title: The footer band opened inside the table and swallowed its last rows
  source: MLI country positions (OECD) - azerbaijan
  location: corpora/mli/positions/azerbaijan.json
  evidence: >
    Azerbaijan prints no page number, so a short line repeated at y = 668 on 10 of
    its 29 pages (share 0.34, just over the declared 0.30) qualified as the foot of
    the page while the table itself runs to y = 703: the band opened at y = 666,
    inside the table, and every span below it was classified as apparatus - among
    them the row of the United Arab Emirates and its printed number 53 at
    y = 676.92. A printed row number is not a page number.
  check: count_equals
  target: "corpora/mli/positions/azerbaijan.json"
  selector: "len(covered_agreements)"
  expected: 54
  why: >
    Already fixed: rules/20-mli.yaml declares R-BAND-DEFINE-MLI-POSITION-AZERBAIJAN
    (page_share 0.80), the position reads 54 rows numbered 1..54 without a gap, and
    row 53 carries United Arab Emirates again. If the band ever re-opens inside the
    table, rows disappear from the artefact and this count moves.

- id: d26-kuwait-packed-date-cell
  invariant: P2
  status: regression
  title: A signature date and its N/A force value arrived packed in one span
  source: MLI country positions (OECD) - kuwait
  location: corpora/mli/positions/kuwait.json
  evidence: >
    Kuwait's row 3 prints its signature date and the entry-into-force value as one
    PDF span, "28/10/2008 N/A": a cell reader that keeps spans whole publishes the
    packed string as the signature date and publishes no entry-into-force value at
    all. The table's own column order decides which half is which.
  check: forbidden_text
  probe: '"signature": "[^"]*N\s*/\s*A'
  probe_kind: regex
  targets: ["corpora/mli/positions/kuwait.json"]
  why: >
    Already fixed: harness/covered.py splits a packed date/N-A cell by the table's
    own column order (row 3 reads signature 28/10/2008, entry_into_force N/A), and
    the artefact's qa reports dated_cells_split_by_text: 41. The regex fires only
    when the packed string is published whole as a signature date again.


- id: d24-diff-polluted-by-artifact
  invariant: F9
  status: defect
  title: The edition diff reports a change caused by an extraction artefact
  source: UN Model 2017 -> 2021
  location: derived/reports/diff-un-model-2017-2021.md
  evidence: '"Article 1 - paragraphs added: 4", where the 4th is the footnote fragment of d11; and "**Articles 8 and 9**" inside the text of Article 8'
  check: report_matches_corpus
  family: un-model
  editions: ["2017", "2021"]
  targets: ["derived/reports/diff-un-model-2017-2021.md"]
  why: >
    A literal-string placeholder would be a signature, not a check. What the
    report must do is agree with the corpus it is a view of, in both directions:
    every Article the corpus holds as modified has to be in the report's modified
    list, every Article the report lists has to be one the corpus holds as
    modified, and the summary numbers have to be the recomputed ones. A report
    built from a second reading of the two PDFs fails on the first count: that
    is where the artefacts came from - invented changes out of page running
    heads, and missed Articles 5, 22 and 25, whose text the corpus holds as
    changed.

    The stronger check this probe still cannot make: comparing the report against
    the Model's own change notes, in prose, would test the *reading* of the
    sources and not the view of the corpus. That needs the Model's introduction
    to be read as a document of its own, which is a corpus family this project
    does not hold yet.

- id: d27-reservation-list-cell-lost-to-the-page
  invariant: P6
  status: target
  title: A reservation list row whose cell the page prints where it cannot be attached
  source: MLI country positions (OECD)
  location: 'corpora/mli/positions/chile.json, Article 3, list row 33 (page 6)'
  evidence: >
    Chile's Article 3 list prints a single `Article 1(2)` between its rows 33 and
    34, 2 pt above row 34's number and 31 pt below row 33's. The row the cell
    stands nearest keeps it, so row 33 ("United States of America") is published
    with an empty provision rather than given the cell beside it.
  check: count_equals
  target: "corpora/mli/positions/batch-report.json"
  selector: "len(reservation_scope_rows_with_an_empty_cell)"
  expected: 1
  why: >
    An empty cell has to be a name, not an absent value: the row is published
    empty - filling it from the row beside it would be a value the page does not
    print - and the family's report names it with its page, its number and which
    cell came back empty. Pinning the count here means the declaration cannot
    drift: a reading that loses another cell to a page break fails this probe
    until the new row is named, and one that stops losing this cell has to update
    the declaration rather than leave it claiming a row that is no longer empty.
    The name itself is held by `test_p06_a_row_the_page_leaves_empty_is_named_not_thinned`,
    which holds the report's names against the artefacts row by row.

    The other empty row this audit found is gone: Serbia's Article 17 list row 64
    (Zimbabwe) was published with an empty provision because the section's band
    ended at the document's last span, and a section that runs to the end of the
    document now runs to the end of the stream.

- id: d28-a-control-reporting-on-a-copy-it-cannot-write
  invariant: F15
  status: defect
  title: A control that reports on a copy its repository cannot repair
  source: .github/workflows/corpus-drift.yml
  location: the job that runs scripts/discipline-drift.py
  evidence: >
    The job checked the library out beside the corpus and handed the control that
    checkout, so what it reported was whatever pin the library happened to carry -
    `pins ['__init__.py', 'board.py', 'ci.py', 'machine_traces.py'] while the source
    has [...six files...]`. The one repair for that red is a push into another
    repository, which no reader of this run can make, and the job stood red for
    hours over a copy nobody here could write.
  check: control_holds_its_own
  why: >
    Which checkouts a run is handed is whose red it reports. A repository holds its
    own copy and the copies committed inside it; a layer it does not hold is read
    by that layer's own run of the same control - the library's, over this corpus,
    where the repair is a re-vendor from here - and the run names that layer and
    where its half is read instead of stopping at the checkouts it was given.
    The probe fires on either way a sibling comes back in: a `repository:` checkout
    in the job, or a switch naming a path that is neither under this repository nor
    inside the `--corpus` checkout. Measured from the other side the answer was
    already there: the library runs this same control over the corpus and itself,
    and it went red on the re-vendor that the corpus could not make for it.
