- id: d13-alternative-label-as-paragraph
  invariant: F4
  status: defect
  title: An "Alternative A/B" label emitted as a fake paragraph
  source: UN Model 2017 and 2021
  location: articles 8, 18, 25 of both editions
  evidence: '"**1.** Article 25 (alternative A)" as a standalone paragraph'
  check: forbidden_text
  probe: '^\*\*1\.\*\* Article \d{1,2} \((?:a|A)lternative [AB]\)$'
  probe_kind: regex
  targets: ["derived/markdown/un-model/2017/article-8.md",
            "derived/markdown/un-model/2017/article-18.md",
            "derived/markdown/un-model/2017/article-25.md",
            "derived/markdown/un-model/2021/article-8.md",
            "derived/markdown/un-model/2021/article-18.md",
            "derived/markdown/un-model/2021/article-25.md"]
  why: >
    The alternative is a structural node in the source. Emitting it as a
    numbered paragraph corrupts the paragraph count and makes the two branches
    indistinguishable (only the eId suffix `__v2` tells them apart).

