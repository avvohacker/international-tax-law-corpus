# Known defects — the audit of 2026-09-27, machine-readable.
#
# This is the red half of the harness. Each entry states a defect found by the
# 2026-09-27 audit that the pipeline must make impossible. Every entry is a
# test: it asserts that the defect is ABSENT.
#
# Why it exists: shape-only gates (ids, headings, XSD) passed while the corpus
# contained a footnote inside the sentence "at least 50 per cent". This file
# is the list of things shape gates could not see.
#
# `check` kinds implemented in harness/checks.py:
#   forbidden_text        probe must NOT appear in the target files
#   count_equals          a counted quantity of a JSON file must equal `expected`
#   field_rule            a named predicate over a JSON file must hold
#   no_local_paths        no absolute environment path may appear in the targets
#   absent_tracked_path   no path matching the glob may be tracked by git
#   control_holds_its_own the job that runs the shared control holds only the
#                         checkouts this repository can repair (rule in
#                         harness/discipline/holds.py)
#
# `status` is one of:
#   defect      found in the audit, must be absent here
#   regression  already fixed, must not come back here
#   target      a property the pipeline must reach

- id: d01-header-inside-sentence-art24-2017
  invariant: F2
  status: defect
  title: A page running header glued inside a sentence
  source: UN Model 2017
  location: article-24, paragraph 4
  evidence: "…be deductible Articles 24 and 25 under the same conditions…"
  check: forbidden_text
  probe: "be deductible Articles 24 and 25"
  probe_kind: literal
  targets: ["derived/markdown/un-model/2017/article-24.md"]
  why: >
    The apparatus line "Articles 24 and 25" sits at the top of the page and is
    not recognised as a running header, so the body text swallows it. G4
    (boilerplate) only inspected the first line of each paragraph.

