name: mcp-drift

# The server is committed in `mcp/` of this repository, and GitHub reads the
# workflows of a repository from its root and from nowhere else, so the control
# that belonged to the server stands here, beside the corpus' own. Everything
# below runs from `mcp/`; nothing about what the control asks changed.
#
# The control this layer can run is the one only a query layer can: it starts the
# server, asks it the questions the README promises answers to, and fails when an
# answer moves. The server owns no data, so it cannot rebuild an artefact and
# compare it with what is committed - what it can do is notice that an answer it
# gave yesterday is not the answer the artefacts give today.
#
# That is the real drift for this layer, and it is invisible from inside any
# single repository. A treaty added to the library, a position read differently,
# a signatories table that gains a row, a page whose text shifts by one
# character - any of them changes what the server says, while not one line under
# `mcp/` changes. The tests read the live corpus and library and assert the
# answers, so the day an answer moves, this run goes red naming it.
#
# The corpus is this checkout, read where it stands - the same bytes the corpus'
# own control rebuilds - and the library is checked out beside it. Both are read
# at their default branches rather than at pinned commits, and a legitimate edit
# upstream turning this run red is the intended behaviour: the answer changed, so
# the claim that it is still true has to be re-earned here. The scheduled run is
# what makes that happen without anybody pushing.
#
# One thing the suite cannot do by itself is notice its own absence: the tests
# skip when the two roots are not named, and a skip is green. So the roots are
# named below and then checked to be the real repositories before pytest runs,
# and a checkout that came back empty fails loudly instead of passing quietly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out this repository, which holds both the corpus and the server
        uses: actions/checkout@v4

      - name: Check out the library the server answers from
        uses: actions/checkout@v4
        with:
          repository: avvohacker/international-tax-law-library
          path: library

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the server and its tests
        # The source PDFs are never committed by the corpus, and this server never
        # reads them: it answers from the committed JSON and the hashes those
        # projects declare about it. So this checkout and the library above are
        # enough, and no fetch step is needed here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: The two roots must be the real repositories, not empty directories
        # A missing or wrong checkout would make the suite skip, and a skip is
        # green -- the failure mode this step exists to refuse.
        run: |
          set -euo pipefail
          test -d ../corpora
          test -f ../provenance/sources.yaml
          test -d ../library/treaties
          test -f ../library/provenance/treaties.yaml
          test -f ../library/treaties/uk-us-2001/treaty.json
          test -f ../library/treaties/no-uk-2013/treaty.json

      - name: Name any answer that moved
        # The suite below asserts the answers; this names the one that moved.
        # It runs first so a red run leads with the fact, what it was, what it
        # is now, and what a move of that fact implies - rather than with an
        # assertion line that says only that something stopped being true.
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
        run: python -m itl_mcp.drift

      - name: Do the answers still come from the data?
        # The verdicts on both held treaties -- not-modified for US-UK, and
        # modified with its whole chain of Articles for UK-Norway -- the MLI
        # lookup, the per-page hash verification, the refusals, and the same
        # questions asked over stdio by a subprocess, the way an MCP host
        # asks them.
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
        run: python -m pytest -q

  exported:
    # The folder, and only what it commits: no checkout of the server beside it,
    # no editable install of this package, nothing but the files a reader who
    # copies `mcp/` out of a fresh clone would have. The job exists because
    # portability is otherwise only visible inside `test_the_folder_travels.py`,
    # where a green suite says the export worked rather than showing it: here the
    # export is a step, a directory a reader can look at, and every claim below
    # is made by the exported copy about itself.
    #
    # What it does not do is fetch anything. The export is read against the same
    # corpus and the same library the control reads, and the questions are the
    # recorded ones, so an answer that moved on the way out of the checkout is a
    # red run here and not a note in a comment.
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository, which holds both the corpus and the server
        uses: actions/checkout@v4

      - name: Check out the library the server answers from
        uses: actions/checkout@v4
        with:
          repository: avvohacker/international-tax-law-library
          path: library

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Export the files this folder commits, and nothing else
        # `git ls-files`, not a copy of the working tree: an untracked file a
        # module needs is exactly what stays behind here, and finding that out in
        # CI is the point.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/addendum"
          git ls-files -z mcp | xargs -0 cp --parents -t "$RUNNER_TEMP/addendum"
          test -f "$RUNNER_TEMP/addendum/mcp/itl_mcp/server.py"
          test -f "$RUNNER_TEMP/addendum/mcp/fixtures/expected-answers.json"
          test -f "$RUNNER_TEMP/addendum/mcp/fixtures/verdicts/no-uk-2013.json"
          echo "exported $(git ls-files mcp | wc -l) files"

      - name: Install only what the exported folder declares
        # The dependencies come from the export's own `requirements.txt`, so the
        # folder is asked whether it can describe what it needs.
        run: python -m pip install --upgrade pip && python -m pip install -r "$RUNNER_TEMP/addendum/mcp/requirements.txt"

      - name: Do the recorded answers still hold, asked from the export?
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
          PYTHONPATH: ${{ runner.temp }}/addendum/mcp
        working-directory: ${{ runner.temp }}/addendum/mcp
        run: python -m itl_mcp.drift

      - name: Do the committed verdicts travel, and are they current?
        # The skeletons are committed in the folder, so a copy of the folder
        # carries them; this asks the copy whether they are what a computation
        # writes and whether the data has moved under them.
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
          PYTHONPATH: ${{ runner.temp }}/addendum/mcp
        working-directory: ${{ runner.temp }}/addendum/mcp
        run: python -m itl_mcp.skeleton --check

      - name: Does the exported folder handshake and offer its tools?
        # The export is started the way an MCP host starts a server, with the
        # folder first on the path and no site packages of *this* package to
        # shadow it: `-S` keeps an installed copy from being loaded instead.
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
        working-directory: ${{ runner.temp }}/addendum/mcp
        run: |
          set -euo pipefail
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-export","version":"0"}}}'
            sleep 1
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                          '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
                          '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"as_modified_verdict","arguments":{"treaty_id":"no-uk-2013"}}}'
            sleep 4
          } | python -S -c 'import runpy,sys; runpy.run_module("itl_mcp.server", run_name="__main__")' > /tmp/export.json
          for tool in as_modified_verdict compare_model_editions \
                      mli_status read_treaty_page reservation_scope sources; do
            grep -q ""name":"$tool"" /tmp/export.json \
              || { echo "::error::the exported folder does not offer $tool"; exit 1; }
          done
          grep -q '"verdict":"modified"' /tmp/export.json \
            || { echo "::error::the exported folder did not answer the verdict"; exit 1; }

  compatibility:
    # The two ends `requires-python = ">=3.11"` claims, beside the pinned 3.13
    # the control above runs on. This layer is the most exposed of the family to
    # the interpreter it runs on - it is the one a user installs, and it is the
    # one that carries the MCP SDK, whose own floor moves - so the same answers
    # are asked again on the oldest supported version and on the newest release,
    # drift control first. The evidence is the corpus and the library, not a
    # machine: nothing is fetched here, so the checkouts are the whole cost.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out this repository, which holds both the corpus and the server
        uses: actions/checkout@v4

      - name: Check out the library the server answers from
        uses: actions/checkout@v4
        with:
          repository: avvohacker/international-tax-law-library
          path: library

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the server and its tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: The two roots must be the real repositories, not empty directories
        run: |
          set -euo pipefail
          test -f ../provenance/sources.yaml
          test -f ../library/provenance/treaties.yaml

      - name: Name any answer that moved
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
        run: python -m itl_mcp.drift

      - name: Does the installed command exist and answer?
        # The README tells a reader to `pip install -e .` and then run
        # `itl-mcp`; the suite drives `python -m itl_mcp.server`, which is a
        # different entry point, so nothing else here builds the package. A
        # broken console script, or a package layout that refuses to install,
        # would reach a user before it reached this workflow.
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
        run: |
          set -euo pipefail
          python -m pip install -e . --no-deps
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            sleep 1
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                          '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 3
          } | itl-mcp > /tmp/tools.json
          for tool in as_modified_verdict compare_model_editions \
                      mli_status read_treaty_page reservation_scope sources; do
            grep -q ""name":"$tool"" /tmp/tools.json \
              || { echo "::error::the installed command does not offer $tool"; exit 1; }
          done

      - name: Do the answers still come from the data, on this interpreter?
        env:
          ITL_CORPUS_ROOT: ${{ github.workspace }}
          ITL_LIBRARY_ROOT: ${{ github.workspace }}/library
        run: python -m pytest -q
